services:
  mysql:
    image: mysql:8.0
    container_name: mysql_gastronomia
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone='-05:00'
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_gastronomia_data:/var/lib/mysql

  mongodb:
    image: mongo:7.0
    container_name: mongo_gastronomia
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}
      TZ: ${TZ}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_gastronomia_data:/data/db

volumes:
  mysql_gastronomia_data:
  mongo_gastronomia_data:
